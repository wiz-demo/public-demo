# Auto-open (or reuse) a staging → main promotion PR after a push to staging.
# After a merge to main, sync main back into staging so the branches do not drift.
name: Promote staging to main

on:
  push:
    branches: [staging, main]

concurrency:
  group: promote-staging-to-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promote-staging-to-main:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: ${{ vars.GAR_STAGING_WIF_PROVIDER || vars.GHA_GCP_WIF_PROVIDER_STAGING }}
          service_account: ${{ vars.GAR_STAGING_SERVICE_ACCOUNT || vars.GHA_GCP_SERVICE_ACCOUNT_STAGING }}

      - name: Load wizwashers-janitor app credentials from GCP Secret Manager
        shell: bash
        run: |
          set -euo pipefail
          SECRETS_PROJECT="${{ vars.WIZ_DEMO_SECRETS_PROJECT || 'demosecrets' }}"
          APP_DETAILS_JSON=$(gcloud secrets versions access latest \
            --secret="wizwasher-janitor-app-details" \
            --project="$SECRETS_PROJECT")
          APP_KEY_JSON=$(gcloud secrets versions access latest \
            --secret="wizwasher-janitor-app-details-key" \
            --project="$SECRETS_PROJECT")

          WIZWASHERS_APP_ID=$(echo "$APP_DETAILS_JSON" | jq -r '.appId')
          WIZWASHERS_APP_PRIVATE_KEY=$(echo "$APP_KEY_JSON" | jq -r '.private_key')

          echo "::add-mask::$WIZWASHERS_APP_ID"
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::$line"
          done <<< "$WIZWASHERS_APP_PRIVATE_KEY"

          echo "WIZWASHERS_APP_ID=$WIZWASHERS_APP_ID" >> "$GITHUB_ENV"
          {
            echo "WIZWASHERS_APP_PRIVATE_KEY<<EOF"
            echo "$WIZWASHERS_APP_PRIVATE_KEY"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Generate Token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        id: app-token
        with:
          app-id: "${{ env.WIZWASHERS_APP_ID }}"
          private-key: "${{ env.WIZWASHERS_APP_PRIVATE_KEY }}"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Check for differences
        id: diff
        run: |
          git fetch origin staging main
          if git diff --quiet origin/staging origin/main; then
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
            echo "No file differences between staging and main"
          else
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
            echo "Files differ - promotion needed"
            echo "short_sha=$(git rev-parse --short origin/staging)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create promotion PR
        if: steps.diff.outputs.has_diff == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          SHORT_SHA: ${{ steps.diff.outputs.short_sha }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = 'staging';
            const base = 'main';
            const shortSha = process.env.SHORT_SHA;
            const date = new Date().toISOString().split('T')[0];

            const buildTitle = () => `🧙 Promote: staging → main (${date}) [${shortSha}]`;
            const buildBody = () => [
              'Automated promotion PR from `staging` to `main`.',
              '',
              `**Commit:** \`${shortSha}\``,
              `**Date:** ${date}`,
              '',
              '## Checklist',
              '- [ ] Changes tested on staging',
              '- [ ] Ready for production',
              '',
              '---',
              '_This PR was automatically created after a push to staging._'
            ].join('\n');

            const { data: existingPRs } = await github.rest.pulls.list({
              owner, repo,
              head: `${owner}:${head}`,
              base,
              state: 'open'
            });

            if (existingPRs.length > 0) {
              const existing = existingPRs[0];
              await github.rest.pulls.update({
                owner, repo,
                pull_number: existing.number,
                title: buildTitle(),
                body: buildBody()
              });
              console.log(`PR #${existing.number} already open for ${head} → ${base}; refreshed to ${shortSha}`);
              return;
            }

            for (const label of [
              { name: 'promotion', color: '5319e7', description: 'Automated staging → main promotion' },
              { name: 'automated', color: 'ededed', description: 'Opened by automation' }
            ]) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label.name });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({ owner, repo, ...label });
                } else {
                  throw error;
                }
              }
            }

            const title = buildTitle();
            const { data: pr } = await github.rest.pulls.create({
              owner, repo, title, head, base,
              body: buildBody()
            });

            await github.rest.issues.addLabels({
              owner, repo,
              issue_number: pr.number,
              labels: ['promotion', 'automated']
            });

            console.log(`Created PR #${pr.number}: ${title}`);

  sync-main-to-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: ${{ vars.GAR_STAGING_WIF_PROVIDER || vars.GHA_GCP_WIF_PROVIDER_STAGING }}
          service_account: ${{ vars.GAR_STAGING_SERVICE_ACCOUNT || vars.GHA_GCP_SERVICE_ACCOUNT_STAGING }}

      - name: Load wizwashers-janitor app credentials from GCP Secret Manager
        shell: bash
        run: |
          set -euo pipefail
          SECRETS_PROJECT="${{ vars.WIZ_DEMO_SECRETS_PROJECT || 'demosecrets' }}"
          APP_DETAILS_JSON=$(gcloud secrets versions access latest \
            --secret="wizwasher-janitor-app-details" \
            --project="$SECRETS_PROJECT")
          APP_KEY_JSON=$(gcloud secrets versions access latest \
            --secret="wizwasher-janitor-app-details-key" \
            --project="$SECRETS_PROJECT")

          WIZWASHERS_APP_ID=$(echo "$APP_DETAILS_JSON" | jq -r '.appId')
          WIZWASHERS_APP_PRIVATE_KEY=$(echo "$APP_KEY_JSON" | jq -r '.private_key')

          echo "::add-mask::$WIZWASHERS_APP_ID"
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::$line"
          done <<< "$WIZWASHERS_APP_PRIVATE_KEY"

          echo "WIZWASHERS_APP_ID=$WIZWASHERS_APP_ID" >> "$GITHUB_ENV"
          {
            echo "WIZWASHERS_APP_PRIVATE_KEY<<EOF"
            echo "$WIZWASHERS_APP_PRIVATE_KEY"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Generate Token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        id: app-token
        with:
          app-id: "${{ env.WIZWASHERS_APP_ID }}"
          private-key: "${{ env.WIZWASHERS_APP_PRIVATE_KEY }}"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true
          token: "${{ steps.app-token.outputs.token }}"

      - name: Sync main to staging
        run: |
          git config --local user.email "235391050+wizwashers-janitor[bot]@users.noreply.github.com"
          git config --local user.name "wizwashers-janitor[bot]"

          for attempt in 1 2 3; do
            git fetch origin
            git checkout -B staging origin/staging

            if git merge-base --is-ancestor origin/main HEAD; then
              echo "✅ Staging is already up-to-date with main"
              exit 0
            fi

            if ! git merge origin/main --no-ff -m "chore: sync main back to staging after promotion"; then
              echo "❌ Merge conflict detected! Manual intervention required."
              git merge --abort
              exit 1
            fi

            if git push origin staging; then
              echo "✅ Staging is now in sync with main"
              exit 0
            fi

            echo "⚠️ staging moved during sync (attempt ${attempt}/3) — rebuilding on the new tip"
            sleep $((attempt * 5))
          done

          echo "❌ Could not sync main into staging after 3 attempts; staging is drifted"
          exit 1
